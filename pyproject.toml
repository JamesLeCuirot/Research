[project]
name = "afacs"
version = "0.1.0"
description = "Layered (HFACS-style) failure analysis of LLM multi-agent traces, applied to the MAST dataset"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "James Le Cuirot" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.69",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
# One command per pipeline stage. Run any of them with `uv run <command> --help`.
afacs-ingest = "afacs.ingest:main"
afacs-render = "afacs.render:main"
afacs-sample = "afacs.sample:main"
afacs-annotate = "afacs.annotate:main"
afacs-agreement = "afacs.agreement:main"
afacs-analysis = "afacs.analysis:main"
afacs-coding-tool = "afacs.coding_tool:main"   # the hand-coding page and its importer

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afacs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
